<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Wings | حجز الطيران الذكي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

    <!-- رأس التطبيق -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="bg-sky-500/10 p-2 rounded-xl border border-sky-500/20">
                    <span class="text-xl">✈️</span>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg text-white tracking-wide">Aegis Wings</h1>
                    <p class="text-[10px] text-sky-400 font-medium">احجز رحلتك بثقة وسرعة</p>
                </div>
            </div>
            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-semibold">متصل 🟢</span>
        </div>
    </header>

    <!-- محتوى التطبيق الرئيسي -->
    <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">
        
        <!-- بطاقة البحث السريع -->
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 shadow-xl">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">الرحلات المتاحة حالياً</h2>
            <div id="flightsResultsList" class="space-y-3">
                <!-- سيتم حقن الكروت هنا برمجياً بجودة عالية -->
                <div class="text-center py-8 text-slate-500 text-sm">
                    <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-sky-500 mb-2"></div>
                    <p>جاري تحميل الرحلات الفاخرة...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- شريط التنقل السفلي الاحترافي -->
    <nav class="bg-slate-900/90 backdrop-blur-md border-t border-slate-800 sticky bottom-0 z-50 px-6 py-2">
        <div class="max-w-md mx-auto flex justify-around items-center text-xs">
            <button class="flex flex-col items-center text-sky-400 py-1">
                <span class="text-lg mb-0.5">🔍</span>
                <span class="font-bold">البحث</span>
            </button>
            <button onclick="alert('قسم الحجوزات قيد التحديث')" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition py-1">
                <span class="text-lg mb-0.5">🎫</span>
                <span>حجوزاتي</span>
            </button>
            <button onclick="alert('حساب المستخدم')" class="flex flex-col items-center text-slate-400 hover:text-slate-200 transition py-1">
                <span class="text-lg mb-0.5">👤</span>
                <span>الحساب</span>
            </button>
        </div>
    </nav>

    <!-- ملف الجافاسكريبت المربوط -->
    <script src="app.js"></script>
</body>
</html>
