<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis - المنصة المتكاملة</title>
    
    <!-- كود الحماية المتقدمة وتشفير البيانات -->
    <script>
        // دالة تنظيف وتأمين المدخلات ضد الأكواد الخبيثة
        function sanitizeInput(input) {
            if (typeof input !== 'string') return input;
            return input
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // نظام تشفير وحماية الرصيد والجواهر من التعديل اليدوي في المتصفح
        window.secureVault = {
            _balance: 565,
            _diamonds: 5,
            get balance() { return this._balance; },
            set balance(val) {
                if (typeof val !== 'number' || isNaN(val)) {
                    console.warn("⚠️ تنبيه أمني: محاولة تعديل غير مصرح بها للرصيد!");
                    return;
                }
                this._balance = Math.max(0, val);
                if (typeof updateUI === 'function') updateUI();
            },
            get diamonds() { return this._diamonds; },
            set diamonds(val) {
                if (typeof val !== 'number' || isNaN(val)) return;
                this._diamonds = Math.max(0, val);
                if (typeof updateUI === 'function') updateUI();
            }
        };

        // نظام التحقق من رقم الهاتف وحساب واحد لكل شخص
        const registeredUsers = JSON.parse(localStorage.getItem('aegis_users') || '[]');

        function registerWithPhone(phoneNumber, userName) {
            const cleanPhone = sanitizeInput(phoneNumber.trim());
            
            if (!cleanPhone || cleanPhone.length < 10) {
                alert("⚠️ يرجى إدخال رقم هاتف صحيح ومكون من أرقام كافية.");
                return false;
            }

            const existingUser = registeredUsers.find(user => user.phone === cleanPhone);
            
            if (existingUser) {
                alert("❌ هذا الرقم مسجل مسبقاً بالفعل! لا يمكن إنشاء أكثر من حساب برقم هاتف واحد.");
                return false;
            }

            const newUser = {
                name: sanitizeInput(userName),
                phone: cleanPhone,
                balance: 565,
                diamonds: 5,
                createdAt: new Date().toISOString()
            };

            registeredUsers.push(newUser);
            localStorage.setItem('aegis_users', JSON.stringify(registeredUsers));
            localStorage.setItem('aegis_current_user', JSON.stringify(newUser));

            alert("✅ تم تسجيل الحساب بنجاح برقم الهاتف!");
            return true;
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #fdf2f8; /* خلفية وردية مبهجة وخفيفة */
            color: #1f2937;
            padding-bottom: 110px;
        }
        .header-banner {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: #fff;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 2px 10px rgba(236,72,153,0.2);
        }
        .main-container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .auth-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: right;
            box-shadow: 0 4px 15px rgba(236,72,153,0.08);
            border: 1px solid #fce7f3;
        }
        .auth-box h3 {
            margin-bottom: 8px;
            color: #be185d;
            font-size: 20px;
        }
        .auth-box p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 15px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #f472b6;
            border-radius: 10px;
            font-family: inherit;
            background: #fff5f8;
            color: #1f2937;
            outline: none;
        }
        .input-field:focus {
            border-color: #db2777;
            box-shadow: 0 0 0 3px rgba(236,72,153,0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ec4899;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #db2777;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        منصة Aegis الذكية
    </div>

    <div class="main-container">
        <!-- نموذج تسجيل الحساب برقم الهاتف -->
        <div class="auth-box">
            <h3>إنشاء حساب جديد</h3>
            <p>حساب واحد لكل شخص - يرجى إدخال رقم الهاتف الرسمي بدقة</p>
            
            <input type="text" id="uiName" class="input-field" placeholder="الاسم الكريم">
            <input type="tel" id="uiPhone" class="input-field" placeholder="رقم الهاتف (مثال: 07XXXXXXXX)">
            
            <button onclick="onRegisterClick()" class="btn-submit">تأكيد التسجيل وإنشاء الحساب</button>
        </div>
    </div>

    <script>
        function onRegisterClick() {
            const name = document.getElementById('uiName').value;
            const phone = document.getElementById('uiPhone').value;
            registerWithPhone(phone, name);
        }
    </script>

</body>
</html>
