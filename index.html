<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Wings - حجز تذاكر الطيران</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">✈️ Aegis Wings للطيران</div>
    </header>

    <div class="container">
        <!-- 1. قسم البحث عن الرحلات -->
        <div id="search-section" class="section active">
            <div class="card">
                <h3 style="color: #0284c7; font-size: 15px; font-weight: 800; margin-bottom: 12px; text-align: center;">🔍 ابحث عن رحلتك القادمة</h3>
                
                <input type="text" id="fromCity" class="input-field" placeholder="من مدينة (مثلاً: بغداد بغداد أو دبي)...">
                <input type="text" id="toCity" class="input-field" placeholder="إلى مدينة (مثلاً: إسطنبول أو القاهرة)...">
                
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="date" id="departDate" class="input-field" style="margin-bottom:0;">
                    <input type="date" id="returnDate" class="input-field" style="margin-bottom:0;">
                </div>

                <button class="btn btn-primary" onclick="searchFlights()" style="background: #0284c7;">بحث عن الرحلات المتاحة 🛫</button>
            </div>

            <!-- نتائج البحث -->
            <div class="card">
                <h4 style="font-size: 13px; color: #0284c7; font-weight: 800; margin-bottom: 8px;">الرحلات المتاحة:</h4>
                <div id="flightsResultsList">
                    <div style="background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 12px; font-size: 11px; margin-bottom: 8px;">
                        <strong>خطوط طيران النجمة</strong><br>
                        بغداد (BGW) ➔ إسطنبول (IST)<br>
                        <span style="color: #0284c7; font-weight: bold;">السعر: $250</span> | <button onclick="alert('تم اختيار الرحلة للانتقال للدفع')" style="float: left; background: #0284c7; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer;">حجز الآن</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. حجوزاتي -->
        <div id="mybookings-section" class="section">
            <div class="card">
                <h3 style="color: #0284c7; font-size: 15px; font-weight: 800; margin-bottom: 10px; text-align: center;">🎫 تذاكري والحجوزات المؤكدة</h3>
                <p style="font-size: 12px; color: #6b7280; text-align: center;">لا توجد حجوزات نشطة حالياً.</p>
            </div>
        </div>

        <!-- 3. ملف المستخدم / الدعم -->
        <div id="profile-section" class="section">
            <div class="card" style="text-align: center;">
                <h3 style="color: #0284c7; font-size: 15px; font-weight: 800; margin-bottom: 10px;">👤 حساب المسافر</h3>
                <p style="font-size: 12px; color: #6b7280; margin-bottom: 15px;">إدارة معلومات جواز السفر وطرق الدفع.</p>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="nav-bar-wrapper">
        <nav class="nav-bar">
            <button class="nav-item active" onclick="switchTab('search', this)">
                <span class="icon">✈️</span> البحث
            </button>
            <button class="nav-item" onclick="switchTab('mybookings', this)">
                <span class="icon">🎫</span> حجوزاتي
            </button>
            <button class="nav-item" onclick="switchTab('profile', this)">
                <span class="icon">👤</span> الحساب
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
